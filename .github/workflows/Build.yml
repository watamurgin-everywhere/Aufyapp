name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make icon catalog
        run: |
          A=Sources/Assets.xcassets
          mkdir -p $A/AppIcon.appiconset $A/AppIconRed.appiconset
          cp icon-blue.png $A/AppIcon.appiconset/icon.png
          cp icon-red.png $A/AppIconRed.appiconset/icon.png
          echo '{"info":{"author":"xcode","version":1}}' > $A/Contents.json
          J='{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}'
          echo "$J" > $A/AppIcon.appiconset/Contents.json
          echo "$J" > $A/AppIconRed.appiconset/Contents.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild -project Aufy.xcodeproj -scheme Aufy \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Aufy.app Payload/
          zip -r Aufy.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Aufy-ipa
          path: Aufy.ipa
